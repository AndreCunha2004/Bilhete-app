/* ---------- desenho ---------- */
function rdp(p,eps){const n=p.length/2;if(n<3)return p.slice();const keep=new Uint8Array(n);keep[0]=keep[n-1]=1;const st=[[0,n-1]];
 while(st.length){const [a,b]=st.pop();const ax=p[a*2],ay=p[a*2+1],bx=p[b*2],by=p[b*2+1],dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);let mx=0,ix=-1;
  for(let i=a+1;i<b;i++){const x=p[i*2],y=p[i*2+1];const d=len?Math.abs(dy*x-dx*y+bx*ay-by*ax)/len:Math.hypot(x-ax,y-ay);if(d>mx){mx=d;ix=i}}
  if(mx>eps&&ix>0){keep[ix]=1;st.push([a,ix],[ix,b])}}
 const out=[];for(let i=0;i<n;i++)if(keep[i])out.push(p[i*2],p[i*2+1]);return out}
function clean(s){if(!s||!Array.isArray(s.p))return null;const c=/^#[0-9a-fA-F]{6}$/.test(s.c)?s.c:'#262C45';const w=Math.max(1,Math.min(90,Number(s.w)||10));
 const p=s.p.length%2?s.p.slice(0,-1):s.p;return {c,w,e:s.e?1:0,p}}
function fitCanvas(cv){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,3);const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:r.width}}
function drawStroke(ctx,s,k){s=clean(s);if(!s||s.p.length<2)return;const p=s.p;ctx.save();ctx.globalCompositeOperation=s.e?'destination-out':'source-over';
 ctx.strokeStyle=ctx.fillStyle=s.c;ctx.lineWidth=Math.max(1,s.w*k);ctx.lineCap='round';ctx.lineJoin='round';
 if(p.length===2){ctx.beginPath();ctx.arc(p[0]*k,p[1]*k,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();ctx.restore();return}
 ctx.beginPath();ctx.moveTo(p[0]*k,p[1]*k);for(let i=2;i<p.length-2;i+=2){ctx.quadraticCurveTo(p[i]*k,p[i+1]*k,(p[i]+p[i+2])/2*k,(p[i+1]+p[i+3])/2*k)}
 ctx.lineTo(p[p.length-2]*k,p[p.length-1]*k);ctx.stroke();ctx.restore()}
function drawAll(ctx,strokes,cw,live){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore();
 const k=cw/W;(Array.isArray(strokes)?strokes:[]).forEach(s=>drawStroke(ctx,s,k));if(live)drawStroke(ctx,live,k)}
function paintNotes(root){loadImgs(root);root.querySelectorAll('canvas[data-note]').forEach(cv=>{const n=S.notes.find(x=>x.id===cv.dataset.note);if(!n)return;const f=fitCanvas(cv);drawAll(f.ctx,n.strokes,f.w)})}
function pack(strokes){let out=strokes.map(s=>({c:s.c,w:s.w,e:s.e,p:s.p}));let eps=1.2;
 for(let t=0;t<6;t++){if(JSON.stringify(out).length<200000)return out;eps*=2;out=strokes.map(s=>({c:s.c,w:s.w,e:s.e,p:rdp(s.p,eps)}))}
 toast('O desenho ficou grande demais. Desfaça alguns traços.');return null}

/* ---------- dados ---------- */
function byDate(){const m={};S.notes.forEach(n=>{(m[n.date]=m[n.date]||new Set()).add(n.slot)});return m}
function countByDate(){const m={};S.notes.forEach(n=>{m[n.date]=(m[n.date]||0)+1});return m}
function bestStreak(){const m=byDate(),ds=Object.keys(m).filter(d=>m[d].size>=2).sort();let best=0,cur=0,prev=null;ds.forEach(d=>{cur=prev&&addDays(prev,1)===d?cur+1:1;best=Math.max(best,cur);prev=d});return best}
function heatHtml(){const t=today(),cnt=countByDate(),m=byDate(),dow=new Date(t+'T12:00:00Z').getUTCDay(),start=addDays(t,-dow-21);
 const names=['D','S','T','Q','Q','S','S'];let cells='';for(let i=0;i<28;i++){const d=addDays(start,i),n=cnt[d]||0,fut=d>t,lv=fut?'fut':n>=3?'l3':n===2?'l2':n===1?'l1':'l0',both=m[d]&&m[d].size>=2;
  const lab=`${shortDate(d)}: ${fut?'ainda não chegou':n?n+(n===1?' bilhete':' bilhetes')+(both?', os dois mandaram':''):'sem bilhetes'}`;
  cells+=n&&!fut?`<button type="button" class="hm ${lv}${d===t?' today':''}" data-hday="${d}" aria-label="${lab}. Ver bilhetes">${n}</button>`:`<span class="hm ${lv}${d===t?' today':''}" role="img" aria-label="${lab}">${fut?'':n||''}</span>`}
 return `<div class="hmgrid" aria-hidden="false">${names.map(x=>`<span class="hmh" aria-hidden="true">${x}</span>`).join('')}${cells}</div>
 <div class="hmleg" aria-hidden="true"><span>menos</span><i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><span>mais</span></div>`}
function streak(){const m=byDate(),both=d=>m[d]&&m[d].size>=2;let d=today();if(!both(d))d=addDays(d,-1);let s=0;while(both(d)){s++;d=addDays(d,-1)}return s}
function partnerPeer(){return S.peers.find(p=>!p.isMe&&p.presence&&p.presence.slot===other())}
function ownedByOther(sl){const c=slots()[sl];return !!(c&&c.uid&&S.uid&&c.uid!==S.uid)}
function identityLocked(){const c=slots()[S.me];return !!(S.me&&S.uid&&c&&c.uid===S.uid)}
function resolveMe(){const c=slots();if(S.uid){for(const k of ['a','b'])if(c[k]&&c[k].uid===S.uid)return k}const ls=lsGet('bilhete.slot');return ls&&c[ls]?ls:null}
function handleErr(e){const c=e&&e.code;console.warn(e);
 if(c==='quota_exceeded')toast('O espaço do app encheu. Apague alguns bilhetes antigos no Mural.');
 else if(c==='invalid_argument'){S.canWrite=false;renderBanner();toast('Sem permissão para enviar. Peça o convite como Editor(a).')}
 else toast('Não deu certo agora. Tente de novo em instantes.')}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>{t.hidden=true},3400)}
function pushPresence(){if(!S.room||!S.me)return;S.room.presence({slot:S.me,mode:S.view==='desenhar'?'desenhando':'aberto',kind:S.view==='desenhar'?D.kind:null,list:S.view==='listas'?S.listId:null,watching:liveOpen}).catch(()=>{})}

 return chips+keys.map(k=>{const it=g[k],st=it.reduce((a,i)=>a+(typeof i.preco==='number'?i.preco:0),0);

/* ---------- mais cores ---------- */
const STD=[['#E53935','Vermelho'],['#FB8C00','Laranja'],['#FDD835','Amarelo'],['#43A047','Verde'],['#1E88E5','Azul'],['#8E24AA','Roxo'],['#EC407A','Rosa'],['#000000','Preto'],['#FFFFFF','Branco'],['#9E9E9E','Cinza']];
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
function recentColors(){try{const a=JSON.parse(lsGet('bilhete.cores')||'[]');return Array.isArray(a)?a.filter(c=>/^#[0-9A-Fa-f]{6}$/.test(c)).slice(0,6):[]}catch(e){return []}}
function pickColor(hex){if(!/^#[0-9A-Fa-f]{6}$/.test(hex))return;hex=hex.toUpperCase();D.color=hex;D.eraser=false;
 if(!COLORS.some(c=>c[0]===hex))lsSet('bilhete.cores',JSON.stringify([hex,...recentColors().filter(c=>c!==hex)].slice(0,6)));closeSheet();syncTools()}
function openColors(){const rc=recentColors();const sw=(c,l)=>`<button type="button" class="sw${['#FFFFFF','#FDD835'].includes(c)?' light':''}" data-pick="${c}" aria-label="${esc(l)}" style="background:${c}"></button>`;
 openSheet(`<div class="sh-head"><h2>Mais cores</h2><button type="button" class="tool" data-close aria-label="Fechar">${I.close}</button></div>
 <section class="stack"><b>Cores padrão</b><div class="cgrid">${STD.map(([c,l])=>sw(c,l)).join('')}</div></section>
 ${rc.length?`<section class="stack"><b>Usadas recentemente</b><div class="recent">${rc.map(c=>sw(c,'Cor '+c)).join('')}</div></section>`:''}
 <section class="card col stack"><b>Escolher no gradiente</b><label for="hue">Cor</label><input id="hue" class="rg hue" type="range" min="0" max="359" value="210">
 <label for="lig">Mais escura ↔ mais clara</label><input id="lig" class="rg" type="range" min="12" max="88" value="50">
 <div class="cprev"><i id="cprev"></i><span id="chex"></span></div><button type="button" class="btn primary block" id="usecolor">Usar esta cor</button></section>
 <label class="native"><input type="color" id="native" value="${/^#[0-9A-Fa-f]{6}$/.test(D.color)?D.color:'#475480'}">Seletor completo do iPhone</label>`,
 ()=>{const hue=$('#hue'),lig=$('#lig');const upd=()=>{const h=+hue.value,l=+lig.value,c=hsl2hex(h,80,l);$('#cprev').style.background=c;$('#chex').textContent=c;
   lig.style.background=`linear-gradient(90deg,${hsl2hex(h,80,12)},${hsl2hex(h,80,50)},${hsl2hex(h,80,88)})`;return c};upd();
  hue.addEventListener('input',upd);lig.addEventListener('input',upd);$('#usecolor').addEventListener('click',()=>pickColor(upd()));
  $('#sheet').querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pickColor(b.dataset.pick)));
  $('#native').addEventListener('change',e=>pickColor(e.target.value))})}

let chatBusy=false,typT=0,typOn=false;
function seenMap(){try{return JSON.parse(lsGet('bilhete.vistos')||'{}')||{}}catch(e){return {}}}
function msgsOf(key){return S.chat.filter(m=>m.key===key)}
function unreadOf(key){const seen=seenMap()[S.listId+'/'+key]||0;return msgsOf(key).some(m=>m.by!==S.me&&m.at>seen)}

 if('newlist' in t.dataset){newListSheet('');return}
 if(t.id==='bell'){openNotifs();return}
 if(t.dataset.act){goAct(t.dataset.act);return}
 if(t.dataset.chat){openThread(t.dataset.chat);return}
 if('mais' in t.dataset){openMais();return}
 if(t.dataset.go==='listas'&&S.view==='listas'){closeList();render();return}
 if(t.dataset.list){gotoList(t.dataset.list);return}
 if('quicklist' in t.dataset){newListSheet('Presentes de Natal');return}
 if('listsBack' in t.dataset){closeList();render();window.scrollTo(0,0);return}
 if(t.dataset.done){toggleDone(t.dataset.done);return}
 if(t.dataset.editItem){editItem(t.dataset.editItem);return}
 if('limits' in t.dataset){openLimits();return}
 if(t.dataset.new){closeSheet();newNote(t.dataset.new);return}
 if(t.dataset.mural){closeSheet();S.filter=t.dataset.mural;S.muralMax=40;go('mural');return}
 if('cancelEdit' in t.dataset){go('mural');return}
 if(t.id==='more'){S.muralMax+=40;render()}else if(t.dataset.go){closeSheet();go(t.dataset.go)}else if(t.dataset.amei)toggleAmei(t.dataset.amei);else if('live' in t.dataset)openLive();
 else if(t.dataset.open)openNote(t.dataset.open);else if(t.dataset.filter){S.filter=t.dataset.filter;S.muralMax=40;render()}else if('close' in t.dataset)closeSheet();
 else if(t.dataset.iam)iam(t.dataset.iam);else if('switch' in t.dataset){if(identityLocked()){toast('Seu perfil está ligado à sua conta Claude.');return}closeSheet();lsSet('bilhete.slot',null);S.me=null;S.choosing=true;render()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#sheet').hidden)backOrClose();else closeFocus()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view!=='desenhar'&&S.me)render()});

/* ---------- conexão ---------- */
async function init(){if(!window.claude||typeof claude.use!=='function'){S.noDb=true;render();return}
 const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
 if(!db){S.noDb=true;render();return}S.db=db;
 if(user){S.uid=await user.id();const cw=await user.can('data.write');if(cw===false)S.canWrite=false}
 const ct=setTimeout(()=>{if(!S.configLoaded){S.configSlow=true;render()}},10000);
 db.doc('casal/config').onSnapshot(s=>{clearTimeout(ct);S.config=s.exists?s.data():{slots:{}};S.configLoaded=true;
  if(!S.choosing){const m=resolveMe();if(m&&m!==S.me){S.me=m;lsSet('bilhete.slot',m);pushPresence()}
   const cm=m&&slots()[m];if(cm&&!cm.uid&&S.uid&&!linking){linking=true;db.doc('casal/config').update({slots:{[m]:{uid:S.uid}}}).catch(()=>{}).finally(()=>{linking=false})}}
  const typing=document.activeElement&&document.activeElement.id==='nick';if(S.view!=='desenhar'&&!typing)render()},
  ()=>{clearTimeout(ct);S.configSlow=true;render()});
 const nt=setTimeout(()=>{if(!S.notesLoaded){S.notesLoaded=true;S.notesErr=true;if(S.view!=='desenhar'&&S.me)render()}},10000);
 db.collection('bilhetes').orderBy('date','desc').limit(300).onSnapshot(snap=>{
  S.allNotes=snap.docs.map(d=>({id:d.id,...d.data()})).filter(n=>typeof n.date==='string'&&(n.slot==='a'||n.slot==='b')).sort((x,y)=>y.date.localeCompare(x.date)||((y.deliverAt||y.createdAt||0)-(x.deliverAt||x.createdAt||0)));S.notes=visibleNotes(S.allNotes);
  if(!snap.metadata.fromCache||S.notes.length){S.notesLoaded=true;S.notesErr=false;clearTimeout(nt)}
  if(S.view!=='desenhar'&&S.me&&$('#sheet').hidden)render()},
  ()=>{clearTimeout(nt);S.notesLoaded=true;S.notesErr=true;if(S.view!=='desenhar'&&S.me)render()});
 db.collection('listas').orderBy('updatedAt','desc').limit(100).onSnapshot(snap=>{S.lists=snap.docs.map(d=>({id:d.id,...d.data()}));S.listsLoaded=true;if(S.view==='listas'&&!S.listId)setTimeout(loadLStats,0);
  if(S.listId&&!S.lists.some(l=>l.id===S.listId)&&snap.metadata&&!snap.metadata.fromCache){closeList();if(S.view==='listas')render();return}
  if(S.view==='listas'){const h=$('#ltitle');if(h){const l=S.lists.find(x=>x.id===S.listId);if(l)h.textContent=l.title||'Lista'}else if($('#sheet').hidden&&!(document.activeElement&&document.activeElement.id==='nl'))render()}
  else if(S.view==='hoje'){const pr=$('#pres');if(pr)pr.innerHTML=presHtml()}},()=>{S.listsLoaded=true});
 db.collection('atividades').orderBy('at','desc').limit(60).onSnapshot(snap=>{onActs(snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>ACT_T.includes(a.t)&&(a.by==='a'||a.by==='b')).map(a=>({...a,at:Number(a.at)||0})).sort((x,y)=>y.at-x.at))},()=>{S.actsLoaded=true});
 setTimeout(pruneActs,8000);
 db.doc('casal/datas').onSnapshot(s=>{const d=s.exists?s.data():null;S.datas=d&&Array.isArray(d.items)?d.items.filter(x=>x&&typeof x.title==='string'&&typeof x.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x=>({id:x.id,title:x.title,date:x.date,tipo:DTIPO[x.tipo]?x.tipo:'outra',anual:!!x.anual,lista:typeof x.lista==='string'?x.lista:null,desc:typeof x.desc==='string'?x.desc:'',criado:Number(x.criado)||0,icon:DIC.some(z=>z[0]===x.icon)?x.icon:'',emoji:typeof x.emoji==='string'?oneEmoji(x.emoji):'',cor:PAL.some(z=>z[0]===x.cor)?x.cor:'',hora:/^\d{2}:\d{2}$/.test(x.hora||'')?x.hora:'',foto:typeof x.foto==='string'&&/^dfoto_[\w-]+$/.test(x.foto)?x.foto:''})):[];if(S.view==='contagem'&&$('#sheet').hidden)render();const cb=$('#cdbox');if(cb&&S.me){cb.innerHTML=countdownHtml();loadImgs(cb)}const dl=$('#dlist');if(dl){dl.innerHTML=datasListHtml();loadImgs(dl)}},()=>{});
 claude.use('mcp').then(m=>{S.mcp=m||null}).catch(()=>{});
 claude.use('room').then(r=>{if(!r)return;S.room=r;r.onPeers(ch=>{S.peers=ch.peers;if(!S.peersT)S.peersT=setTimeout(()=>{S.peersReady=true;onPeers()},1500);onPeers()},()=>{});pushPresence()});
 render()}
window.addEventListener('error',e=>{console.warn(e.error||e.message);toast('Algo deu errado. Se a tela travar, feche e abra o app.')});
window.addEventListener('unhandledrejection',e=>{console.warn(e.reason)});
render();init().catch(e=>{console.warn(e);S.noDb=true;render()});
}
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
